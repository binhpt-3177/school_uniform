services:
  mysql:
    image: mysql:5.7
    restart: always
    env_file:
      - .env.mysql
    ports:
      - "3306:3306"
    networks:
      - app-network
    volumes:
      - mysql-data-3:/var/lib/mysql

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    depends_on:
      - mysql
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: dev.Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env.frontend
    depends_on:
      - mysql
      - backend
    networks:
      - app-network
    volumes:
      - ./frontend:/app

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data-3:
