services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .env.mysql
    ports:
      - "3306:3306"
    volumes:
      - mysql-data-4:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql_test:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .env.test.mysql
    ports:
      - "3307:3306"
    volumes:
      - mysql-data-test-4:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    env_file:
      - .env.backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/usr/src/app
      - be_node_modules:/usr/src/app/node_modules
    working_dir: /usr/src/app
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network
    command: ["npm", "run", "start:dev"]
    tty: true
    stdin_open: true

  frontend:
    build:
      context: ./frontend
      dockerfile: dev.Dockerfile
    volumes:
      - ./frontend:/usr/src/fe/app
      - fe_node_modules:/usr/src/fe/app/node_modules
    ports:
      - "5000:5000"
    working_dir: /usr/src/fe/app
    env_file:
      - .env.frontend
    depends_on:
      - mysql
      - backend
    stdin_open: true
    tty: true
    command: sh
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data-4:
  mysql-data-test-4:
  fe_node_modules:
  be_node_modules:
