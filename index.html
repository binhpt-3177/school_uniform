    <link rel="apple-touch-icon" href="/school_uniform/logo192.png" />

  <body>
    <!-- Runtime env injected by entrypoint.sh into /env.js BEFORE the app bundle loads.
         Loaded via document.write so Vite's HTML scanner skips it (no bundle warning).
         /school_uniform/ is replaced at build time with the configured base path,
         so this works for both Docker (base='/') and GitHub Pages (base='/repo-name/'). -->
    <script>
      document.write('<script src="/school_uniform/env.js"><\/script>');
    </script>

    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

  </body>
</html>
