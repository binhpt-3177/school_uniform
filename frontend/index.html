<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="School Uniform — React 19 + Vite frontend" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css"
    />
    <title>School Uniform</title>
  </head>
  <body>
    <!-- Runtime env injected by entrypoint.sh into /env.js BEFORE the app bundle loads.
         %BASE_URL% is replaced by Vite at build time with the configured base path,
         so this works for both Docker (base='/') and GitHub Pages (base='/repo-name/'). -->
    <script src="%BASE_URL%env.js"></script>

    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
